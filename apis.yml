aid: wooden-street
name: Wooden Street
description: 'Wooden Street (operated by Ufurnish Technology Pvt. Ltd.) is an Indian
  direct-to-consumer furniture and home-furnishing brand founded in 2015 in Jaipur,
  Rajasthan by Lokendra Ranawat, Virendra Ranawat, Dinesh Pratap Singh and Vikas Baheti.
  It sells solid-wood and custom-made furniture, mattresses, home decor, modular
  kitchens and wardrobes through woodenstreet.com and a company-owned, company-operated
  network of experience stores across more than 100 Indian cities, backed by its own
  manufacturing and warehousing. The company is venture-backed (Indian Angel Network
  and Rajasthan Venture Capital Funds, then WestBridge Capital in 2022 and a Series C
  led by Premji Invest) and appears in the API Evangelist network via the
  secondary-market harvest, where it is listed on EquityZen and Nasdaq Private Market.
  As of this enrichment pass Wooden Street publishes no public developer program: there
  is no developer portal, API reference, OpenAPI/GraphQL/AsyncAPI definition, SDK,
  Postman collection, MCP server or agent card anywhere on its public surface, and its
  robots.txt explicitly disallows /api/. A first-party backend host, api.woodenstreet.com,
  is reachable and answers with a JSON envelope, but it is the undocumented private
  backend for the retail storefront and mobile apps rather than a published API product.'
